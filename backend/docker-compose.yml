services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasktify
      POSTGRES_USER: tasktify
      POSTGRES_PASSWORD: tasktify
    ports:
      - "5432:5432"
    volumes:
      - tasktify-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasktify"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tasktify-postgres:
