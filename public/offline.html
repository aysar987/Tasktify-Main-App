<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2F6FE4" />
    <title>Offline | Tasktify</title>
    <style>
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #eef3fb;
        color: #172033;
        display: flex;
        font-family: system-ui, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      main { max-width: 420px; }
      img { height: 104px; width: 104px; object-fit: contain; }
      h1 { font-size: 1.75rem; margin: 20px 0 8px; }
      p { color: #526079; line-height: 1.6; margin: 0 0 24px; }
      button {
        background: #2f6fe4;
        border: 0;
        border-radius: 999px;
        color: white;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 12px 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Kamu sedang offline</h1>
      <p>Periksa koneksi internet, lalu coba lagi untuk melanjutkan di Tasktify.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
